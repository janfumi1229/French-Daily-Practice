<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Practice — History</title>
  <link rel="stylesheet" href="lib/task.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6ff;
      color: #1a1a2e;
      min-height: 100vh;
    }
    header {
      background: #4f46e5;
      color: #fff;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
    header a   { color: #c7d2fe; text-decoration: none; font-size: 0.88rem; }
    header a:hover { color: #fff; text-decoration: underline; }

    main { max-width: 820px; margin: 0 auto; padding: 32px 24px; }

    .fp-hist-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 24px;
    }

    .fp-hist-btn {
      padding: 8px 18px;
      border: 1.5px solid #6366f1;
      background: #fff;
      color: #4f46e5;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .fp-hist-btn:hover { background: #eef2ff; }
    .fp-hist-btn.danger { border-color: #ef4444; color: #dc2626; }
    .fp-hist-btn.danger:hover { background: #fef2f2; }

    #fp-hist-list { display: flex; flex-direction: column; gap: 20px; }

    .fp-hist-entry {
      background: #fff;
      border: 1px solid #e0e7ff;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .fp-hist-entry-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .fp-hist-date { font-weight: 700; font-size: 0.92rem; color: #1e1b4b; }

    .fp-hist-type {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 9px;
      border-radius: 12px;
      letter-spacing: 0.05em;
    }
    .fp-hist-type.essay       { background: #e0e7ff; color: #3730a3; }
    .fp-hist-type.translation { background: #dcfce7; color: #166534; }
    .fp-hist-type.skipped     { background: #fef3c7; color: #92400e; }

    .fp-hist-title { font-size: 0.9rem; color: #374151; margin-bottom: 10px; }

    .fp-hist-content {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.875rem;
      color: #374151;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }

    .fp-hist-translations {
      list-style: none;
      padding: 0; margin: 0 0 10px;
    }
    .fp-hist-translations li {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: 0.875rem;
    }

    .fp-hist-feedback-toggle {
      background: none;
      border: 1px solid #c7d2fe;
      color: #6366f1;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .fp-hist-feedback-toggle:hover { background: #eef2ff; }

    .fp-hist-feedback {
      margin-top: 12px;
      padding: 16px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 0.875rem;
      line-height: 1.7;
    }

    .fp-hist-empty {
      text-align: center;
      color: #9ca3af;
      padding: 60px 24px;
      font-size: 1rem;
    }

    .fp-hist-status-done    { color: #15803d; font-weight: 600; font-size: 0.8rem; margin-left: auto; }
    .fp-hist-status-skipped { color: #92400e; font-weight: 600; font-size: 0.8rem; margin-left: auto; }

    /* Markdown output inside feedback */
    .fp-hist-feedback .fp-md-h2 {
      font-size: 1rem; font-weight: 700; color: #166534;
      margin: 14px 0 4px; padding-bottom: 3px;
      border-bottom: 1px solid #bbf7d0;
    }
    .fp-hist-feedback .fp-md-h3 { font-size: 0.92rem; font-weight: 600; color: #15803d; margin: 10px 0 3px; }
    .fp-hist-feedback .fp-md-p  { margin: 3px 0; }
    .fp-hist-feedback .fp-md-list { padding-left: 18px; margin: 3px 0; }
    .fp-hist-feedback strong { color: #166534; }
    .fp-hist-feedback del    { color: #dc2626; text-decoration: line-through; }
  </style>
</head>
<body>
  <header>
    <h1>🇫🇷 Practice History</h1>
    <a href="javascript:window.close()">← Close</a>
  </header>
  <main>
    <div class="fp-hist-toolbar">
      <button class="fp-hist-btn"        id="btn-export">Export JSON</button>
      <button class="fp-hist-btn danger" id="btn-clear">Clear All History</button>
    </div>
    <div id="fp-hist-list">
      <div class="fp-hist-empty">Loading history…</div>
    </div>
  </main>

  <script type="module" src="history.js"></script>
</body>
</html>
